[package]
name = "codelane-tauri"
version = "0.2.6"
edition = "2021"
license = "MIT"
description = "Codelane - Agentic Development Environment (Tauri shell)"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "^2.0", features = [] }

[dependencies]
# Tauri core
tauri = { version = "^2.1", features = ["protocol-asset"] }
tauri-plugin-shell = "^2.0"
tauri-plugin-fs = "^2.0"
tauri-plugin-dialog = "^2.0"
tauri-plugin-process = "^2.0"
tauri-plugin-clipboard-manager = "^2.1"
tauri-plugin-os = "^2.0"
tauri-plugin-notification = "^2.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async
tokio = { version = "1.42", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# PTY handling
portable-pty = "0.8"

# Utilities
uuid = { version = "1.11", features = ["v4"] }
dirs = "5.0"
chrono = "0.4"
sysinfo = "0.32"
zip-extract = "0.1"
tempfile = "3.14"
sha2 = "0.10"
hex = "0.4"

# Search (gitignore-aware file walking + regex)
ignore = "0.4"
regex = "1"

# File watching
notify = "6.1"

# Tree-sitter for code parsing (dependency analysis)
tree-sitter = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-go = "0.23"

# Internal crates (for Tauri commands)
codelane-terminal = { path = "../crates/codelane-terminal" }
codelane-git = { path = "../crates/codelane-git" }
codelane-core = { path = "../crates/codelane-core" }
tauri-plugin-store = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
devtools = ["tauri/devtools"]

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "^2.0"

[lib]
name = "codelane_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dev-dependencies]
tempfile = "3.14"
pretty_assertions = "1.4"
