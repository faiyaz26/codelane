name: Release App

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Optional tag name. If empty, uses version from src-tauri/tauri.conf.json"
        required: false
        type: string

jobs:
  build-tauri:
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            name: macos
          - platform: ubuntu-22.04
            args: ""
            name: linux
          - platform: windows-latest
            args: "--target x86_64-pc-windows-msvc"
            name: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: v1

      - name: Install system dependencies (Linux only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build and sign
        run: |
          # Run build using the CLI directly to ensure signatures are generated
          pnpm tauri build ${{ matrix.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Rename updater artifacts
        shell: bash
        run: |
          # Rename tarballs and their signatures to avoid collisions
          find target -name "Codelane.app.tar.gz" -exec sh -c 'mv "$1" "${1%/*}/Codelane_macos.app.tar.gz"' _ {} \; || true
          find target -name "Codelane.app.tar.gz.sig" -exec sh -c 'mv "$1" "${1%/*}/Codelane_macos.app.tar.gz.sig"' _ {} \; || true
          find target -name "*.AppImage.tar.gz" -exec sh -c 'mv "$1" "${1%/*}/Codelane_linux_x64.AppImage.tar.gz"' _ {} \; || true
          find target -name "*.AppImage.sig" -exec sh -c 'mv "$1" "${1%/*}/Codelane_linux_x64.AppImage.sig"' _ {} \; || true
          find target -name "*.zip" -exec sh -c 'mv "$1" "${1%/*}/Codelane_windows_x64.zip"' _ {} \; || true
          find target -name "*.zip.sig" -exec sh -c 'mv "$1" "${1%/*}/Codelane_windows_x64.zip.sig"' _ {} \; || true

      - name: Notarize DMG (macOS only)
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          mkdir -p notarized
          find target -type f -name "*.dmg" -print0 | while IFS= read -r -d '' dmg; do
            echo "Submitting $dmg for notarization..."
            xcrun notarytool submit "$dmg" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait
            echo "Stapling $dmg..."
            xcrun stapler staple "$dmg"
            cp "$dmg" notarized/
          done

      - name: Prepare artifacts
        shell: bash
        run: |
          mkdir dist
          # Copy notarized DMG if it exists, otherwise build DMG
          if [ -d "notarized" ] && ls notarized/*.dmg >/dev/null 2>&1; then
            cp notarized/*.dmg dist/
          else
            find target -iname "*.dmg" -exec cp {} dist/ \; || true
          fi
          find target -iname "*.AppImage" -exec cp {} dist/ \; || true
          find target -iname "*.AppImage.sig" -exec cp {} dist/ \; || true
          find target -iname "*.deb" -exec cp {} dist/ \; || true
          find target -iname "*.msi" -exec cp {} dist/ \; || true
          find target -iname "*.exe" -exec cp {} dist/ \; || true
          find target -iname "*.zip" -exec cp {} dist/ \; || true
          find target -iname "*.zip.sig" -exec cp {} dist/ \; || true
          find target -iname "*.tar.gz" -exec cp {} dist/ \; || true
          find target -iname "*.tar.gz.sig" -exec cp {} dist/ \; || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-artifacts-${{ matrix.name }}
          path: dist/

  create-release:
    needs: [build-tauri]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Read version
        id: version
        run: |
          VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          echo "value=$VERSION" >> $GITHUB_OUTPUT

      - name: Resolve tag name
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "value=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "value=v${{ steps.version.outputs.value }}" >> $GITHUB_OUTPUT
          fi

      - name: Create tag if missing
        run: |
          TAG="${{ steps.tag.outputs.value }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists"
          else
            # Try to push, but don't fail the whole job if it fails due to permissions
            git tag "$TAG"
            git push origin "$TAG" || echo "Failed to push tag, but continuing..."
          fi

      - name: List artifacts (debug)
        run: find artifacts -type f | sort

      - name: Generate latest.json
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          TAG="${{ steps.tag.outputs.value }}"
          REPO="${{ github.repository }}"
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Initialize the master JSON structure using jq
          jq -n --arg version "$VERSION" --arg notes "Release $TAG" --arg pub_date "$PUB_DATE" '{version: $version, notes: $notes, pub_date: $pub_date, platforms: {}}' > latest.json

          # Find all signature files across all downloaded artifacts
          find artifacts -name "*.sig" | while read sig_path; do
            echo "Processing signature: $sig_path"
            SIG=$(cat "$sig_path")
            
            # Get the binary path (the file without .sig extension)
            BIN_PATH="${sig_path%.sig}"
            
            if [ -f "$BIN_PATH" ]; then
              FILE=$(basename "$BIN_PATH")
              URL="https://github.com/$REPO/releases/download/$TAG/$FILE"
              
              # Determine platform key based on filename/path
              PLATFORM=""
              if [[ "$FILE" == *"macos"* ]] || [[ "$sig_path" == *"macos"* ]] || [[ "$FILE" == *"darwin"* ]]; then
                if [[ "$FILE" == *"aarch64"* ]] || [[ "$FILE" == *"silicon"* ]]; then
                  PLATFORM="darwin-aarch64"
                elif [[ "$FILE" == *"x86_64"* ]] || [[ "$FILE" == *"intel"* ]]; then
                  PLATFORM="darwin-x86_64"
                else
                  PLATFORM="darwin-universal"
                fi
              elif [[ "$FILE" == *".AppImage"* ]]; then
                PLATFORM="linux-x86_64"
              elif [[ "$FILE" == *".zip"* ]]; then
                PLATFORM="windows-x86_64"
              fi
              
              if [ -n "$PLATFORM" ]; then
                if [ "$PLATFORM" == "darwin-universal" ]; then
                  jq --arg sig "$SIG" --arg url "$URL" '.platforms["darwin-aarch64"] = {signature: $sig, url: $url} | .platforms["darwin-x86_64"] = {signature: $sig, url: $url}' latest.json > tmp.json && mv tmp.json latest.json
                else
                  jq --arg sig "$SIG" --arg url "$URL" --arg key "$PLATFORM" '.platforms[$key] = {signature: $sig, url: $url}' latest.json > tmp.json && mv tmp.json latest.json
                fi
              fi
            fi
          done
          
          cat latest.json

      - name: Flatten artifacts
        run: |
          mkdir release_assets
          find artifacts -type f -exec cp {} release_assets/ \;
          cp latest.json release_assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: Codelane ${{ steps.tag.outputs.value }}
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: true
          files: |
            release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
