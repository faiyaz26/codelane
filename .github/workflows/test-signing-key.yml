name: Test Tauri Signing Key

on:
  workflow_dispatch:

jobs:
  test-key:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Create dummy file
        run: echo "Hello World" > dummy.txt

      - name: Test Private Key Password
        run: |
          echo "Testing if the private key can be decrypted with the provided password..."
          pnpm tauri signer sign dummy.txt
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY || secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD || secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Success Validation
        run: echo "✅ If you see this, your TAURI_SIGNING_PRIVATE_KEY and Password are correct!"
