name: Release (No Notarize)

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Optional tag name. If empty, uses version from src-tauri/tauri.conf.json"
        required: false
        type: string

jobs:
  build-macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - args: "--target aarch64-apple-darwin"
            arch: silicon
          - args: "--target x86_64-apple-darwin"
            arch: intel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          # Cache buster to clear corrupted manifest state
          key: v1

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build (${{ matrix.arch }})
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }}
          includeUpdaterJson: true

      - name: Rename updater artifacts
        shell: bash
        run: |
          # Rename tarballs and their signatures
          find target -name "Codelane.app.tar.gz" -exec sh -c 'mv "$1" "${1%.app.tar.gz}_${{ matrix.arch }}.app.tar.gz"' _ {} \;
          find target -name "Codelane.app.tar.gz.sig" -exec sh -c 'mv "$1" "${1%.app.tar.gz.sig}_${{ matrix.arch }}.app.tar.gz.sig"' _ {} \;

      - name: Upload artifacts (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            target/*/release/bundle/dmg/*.dmg
            target/*/release/bundle/macos/*.tar.gz
            target/*/release/bundle/macos/*.sig

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: v1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build for Linux
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          includeUpdaterJson: true

      - name: Rename updater artifacts
        shell: bash
        run: |
          find target -name "*.AppImage.tar.gz" -exec sh -c 'mv "$1" "${1%.AppImage.tar.gz}_linux_x64.AppImage.tar.gz"' _ {} \; || true
          find target -name "*.AppImage.sig" -exec sh -c 'mv "$1" "${1%.AppImage.sig}_linux_x64.AppImage.sig"' _ {} \; || true

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/appimage/*.tar.gz
            target/release/bundle/appimage/*.sig
            target/release/bundle/deb/*.deb

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: v1

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build for Windows
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          args: --target x86_64-pc-windows-msvc
          includeUpdaterJson: true

      - name: Rename updater artifacts
        shell: bash
        run: |
          find target -name "*.zip" -exec sh -c 'mv "$1" "${1%.zip}_windows_x64.zip"' _ {} \; || true
          find target -name "*.zip.sig" -exec sh -c 'mv "$1" "${1%.zip.sig}_windows_x64.zip.sig"' _ {} \; || true

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*.zip
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*.sig

  create-release:
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Read version
        id: version
        run: |
          VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          echo "value=$VERSION" >> $GITHUB_OUTPUT

      - name: Resolve tag name
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "value=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "value=v${{ steps.version.outputs.value }}" >> $GITHUB_OUTPUT
          fi

      - name: Create tag if missing
        run: |
          TAG="${{ steps.tag.outputs.value }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists"
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: List artifacts (debug)
        run: find artifacts -type f | sort

      - name: Generate latest.json
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          TAG="${{ steps.tag.outputs.value }}"
          REPO="${{ github.repository }}"
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Initialize the master JSON structure using jq
          jq -n \
            --arg version "$VERSION" \
            --arg notes "Release $TAG" \
            --arg pub_date "$PUB_DATE" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: {}}' > latest.json

          # macOS Intel
          if ls artifacts/macos-intel/**/*.app.tar.gz.sig >/dev/null 2>&1; then
            SIG=$(cat artifacts/macos-intel/**/*.app.tar.gz.sig)
            FILE=$(basename $(ls artifacts/macos-intel/**/*.app.tar.gz))
            URL="https://github.com/$REPO/releases/download/$TAG/$FILE"
            jq --arg sig "$SIG" --arg url "$URL" '.platforms["darwin-x86_64"] = {signature: $sig, url: $url}' latest.json > tmp.json && mv tmp.json latest.json
          fi

          # macOS Silicon
          if ls artifacts/macos-silicon/**/*.app.tar.gz.sig >/dev/null 2>&1; then
            SIG=$(cat artifacts/macos-silicon/**/*.app.tar.gz.sig)
            FILE=$(basename $(ls artifacts/macos-silicon/**/*.app.tar.gz))
            URL="https://github.com/$REPO/releases/download/$TAG/$FILE"
            jq --arg sig "$SIG" --arg url "$URL" '.platforms["darwin-aarch64"] = {signature: $sig, url: $url}' latest.json > tmp.json && mv tmp.json latest.json
          fi

          # Linux
          if ls artifacts/linux/**/*.AppImage.sig >/dev/null 2>&1; then
            SIG=$(cat artifacts/linux/**/*.AppImage.sig)
            FILE=$(basename $(ls artifacts/linux/**/*.AppImage.tar.gz))
            URL="https://github.com/$REPO/releases/download/$TAG/$FILE"
            jq --arg sig "$SIG" --arg url "$URL" '.platforms["linux-x86_64"] = {signature: $sig, url: $url}' latest.json > tmp.json && mv tmp.json latest.json
          fi

          # Windows
          if ls artifacts/windows/**/*.zip.sig >/dev/null 2>&1; then
            SIG=$(cat artifacts/windows/**/*.zip.sig)
            FILE=$(basename $(ls artifacts/windows/**/*.zip))
            URL="https://github.com/$REPO/releases/download/$TAG/$FILE"
            jq --arg sig "$SIG" --arg url "$URL" '.platforms["windows-x86_64"] = {signature: $sig, url: $url}' latest.json > tmp.json && mv tmp.json latest.json
          fi
          
          cat latest.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: Codelane ${{ steps.tag.outputs.value }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.app.tar.gz
            artifacts/**/*.AppImage
            artifacts/**/*.AppImage.tar.gz
            artifacts/**/*.deb
            artifacts/**/*.msi
            artifacts/**/*.exe
            artifacts/**/*.zip
            latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
