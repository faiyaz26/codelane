name: Release (No Notarize)

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Optional tag name. If empty, uses version from src-tauri/tauri.conf.json"
        required: false
        type: string

jobs:
  build-tauri:
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            name: macos
          - platform: ubuntu-22.04
            args: ""
            name: linux
          - platform: windows-latest
            args: "--target x86_64-pc-windows-msvc"
            name: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: v1

      - name: Install system dependencies (Linux only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Provide both sets of variables for maximum compatibility
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }}
          includeUpdaterJson: true

      - name: Rename updater artifacts
        shell: bash
        run: |
          # Rename tarballs and their signatures
          find target -name "Codelane.app.tar.gz" -exec sh -c 'mv "$1" "${1%.app.tar.gz}_${{ matrix.name }}.app.tar.gz"' _ {} \; || true
          find target -name "Codelane.app.tar.gz.sig" -exec sh -c 'mv "$1" "${1%.app.tar.gz.sig}_${{ matrix.name }}.app.tar.gz.sig"' _ {} \; || true
          find target -name "*.AppImage.tar.gz" -exec sh -c 'mv "$1" "${1%.AppImage.tar.gz}_${{ matrix.name }}.AppImage.tar.gz"' _ {} \; || true
          find target -name "*.AppImage.sig" -exec sh -c 'mv "$1" "${1%.AppImage.sig}_${{ matrix.name }}.AppImage.sig"' _ {} \; || true
          find target -name "*.zip" -exec sh -c 'mv "$1" "${1%.zip}_${{ matrix.name }}.zip"' _ {} \; || true
          find target -name "*.zip.sig" -exec sh -c 'mv "$1" "${1%.zip.sig}_${{ matrix.name }}.zip.sig"' _ {} \; || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-artifacts-${{ matrix.name }}
          path: |
            target/*/release/bundle/
            target/release/bundle/

  create-release:
    needs: [build-tauri]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Read version
        id: version
        run: |
          VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          echo "value=$VERSION" >> $GITHUB_OUTPUT

      - name: Resolve tag name
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "value=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "value=v${{ steps.version.outputs.value }}" >> $GITHUB_OUTPUT
          fi

      - name: Create tag if missing
        run: |
          TAG="${{ steps.tag.outputs.value }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists"
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: List artifacts (debug)
        run: find artifacts -type f | sort

      - name: Generate latest.json
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          TAG="${{ steps.tag.outputs.value }}"
          REPO="${{ github.repository }}"
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Initialize the master JSON structure using jq
          jq -n \
            --arg version "$VERSION" \
            --arg notes "Release $TAG" \
            --arg pub_date "$PUB_DATE" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: {}}' > latest.json

          # macOS (Universal)
          if ls artifacts/tauri-artifacts-macos/**/*.app.tar.gz.sig >/dev/null 2>&1; then
            SIG=$(cat artifacts/tauri-artifacts-macos/**/*.app.tar.gz.sig)
            FILE=$(basename $(ls artifacts/tauri-artifacts-macos/**/*.app.tar.gz))
            URL="https://github.com/$REPO/releases/download/$TAG/$FILE"
            jq --arg sig "$SIG" --arg url "$URL" '.platforms["darwin-aarch64"] = {signature: $sig, url: $url} | .platforms["darwin-x86_64"] = {signature: $sig, url: $url}' latest.json > tmp.json && mv tmp.json latest.json
          fi

          # Linux
          if ls artifacts/tauri-artifacts-linux/**/*.AppImage.sig >/dev/null 2>&1; then
            SIG=$(cat artifacts/tauri-artifacts-linux/**/*.AppImage.sig)
            FILE=$(basename $(ls artifacts/tauri-artifacts-linux/**/*.AppImage.tar.gz))
            URL="https://github.com/$REPO/releases/download/$TAG/$FILE"
            jq --arg sig "$SIG" --arg url "$URL" '.platforms["linux-x86_64"] = {signature: $sig, url: $url}' latest.json > tmp.json && mv tmp.json latest.json
          fi

          # Windows
          if ls artifacts/tauri-artifacts-windows/**/*.zip.sig >/dev/null 2>&1; then
            SIG=$(cat artifacts/tauri-artifacts-windows/**/*.zip.sig)
            FILE=$(basename $(ls artifacts/tauri-artifacts-windows/**/*.zip))
            URL="https://github.com/$REPO/releases/download/$TAG/$FILE"
            jq --arg sig "$SIG" --arg url "$URL" '.platforms["windows-x86_64"] = {signature: $sig, url: $url}' latest.json > tmp.json && mv tmp.json latest.json
          fi
          
          cat latest.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: Codelane ${{ steps.tag.outputs.value }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.tar.gz
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.msi
            artifacts/**/*.exe
            artifacts/**/*.zip
            latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
