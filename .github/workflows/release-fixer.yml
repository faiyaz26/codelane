name: Release Fixer

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "The ID of the workflow run to get artifacts from"
        required: true
        type: string
      tag_name:
        description: "The tag name (e.g. v0.2.0)"
        required: true
        default: "v0.2.0"
        type: string

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          run-id: ${{ github.event.inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Read version
        id: version
        run: |
          VERSION=$(echo "${{ github.event.inputs.tag_name }}" | sed 's/^v//')
          echo "value=$VERSION" >> $GITHUB_OUTPUT

      - name: Create tag if missing
        run: |
          TAG="${{ github.event.inputs.tag_name }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists"
          else
            git tag "$TAG"
            git push origin "$TAG" || echo "Failed to push tag, but continuing..."
          fi

      - name: List artifacts (debug)
        run: find artifacts -type f | sort

      - name: Generate latest.json
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          TAG="${{ github.event.inputs.tag_name }}"
          REPO="${{ github.repository }}"
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Initialize the master JSON structure using jq
          jq -n --arg version "$VERSION" --arg notes "Release $TAG" --arg pub_date "$PUB_DATE" '{version: $version, notes: $notes, pub_date: $pub_date, platforms: {}}' > latest.json

          # Find all signature files across all downloaded artifacts
          find artifacts -name "*.sig" | while read sig_path; do
            echo "Processing signature: $sig_path"
            SIG=$(cat "$sig_path")
            
            # Get the binary path (the file without .sig extension)
            BIN_PATH="${sig_path%.sig}"
            
            if [ -f "$BIN_PATH" ]; then
              FILE=$(basename "$BIN_PATH")
              URL="https://github.com/$REPO/releases/download/$TAG/$FILE"
              
              # Determine platform key based on filename/path
              PLATFORM=""
              if [[ "$FILE" == *"macos"* ]] || [[ "$sig_path" == *"macos"* ]] || [[ "$FILE" == *"darwin"* ]]; then
                if [[ "$FILE" == *"aarch64"* ]] || [[ "$FILE" == *"silicon"* ]]; then
                  PLATFORM="darwin-aarch64"
                elif [[ "$FILE" == *"x86_64"* ]] || [[ "$FILE" == *"intel"* ]]; then
                  PLATFORM="darwin-x86_64"
                else
                  PLATFORM="darwin-universal"
                fi
              elif [[ "$FILE" == *".AppImage"* ]]; then
                PLATFORM="linux-x86_64"
              elif [[ "$FILE" == *".zip"* ]]; then
                PLATFORM="windows-x86_64"
              fi
              
              if [ -n "$PLATFORM" ]; then
                if [ "$PLATFORM" == "darwin-universal" ]; then
                  jq --arg sig "$SIG" --arg url "$URL" '.platforms["darwin-aarch64"] = {signature: $sig, url: $url} | .platforms["darwin-x86_64"] = {signature: $sig, url: $url}' latest.json > tmp.json && mv tmp.json latest.json
                  echo "Added universal macOS signatures to darwin-aarch64 and darwin-x86_64"
                else
                  jq --arg sig "$SIG" --arg url "$URL" --arg key "$PLATFORM" '.platforms[$key] = {signature: $sig, url: $url}' latest.json > tmp.json && mv tmp.json latest.json
                  echo "Added $PLATFORM signature"
                fi
              fi
            fi
          done
          
          cat latest.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name }}
          name: Codelane ${{ github.event.inputs.tag_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: true
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.tar.gz
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.msi
            artifacts/**/*.exe
            artifacts/**/*.zip
            latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
